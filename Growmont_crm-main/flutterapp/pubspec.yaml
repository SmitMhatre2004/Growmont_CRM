name: growmont_crm
description: Growmont Employee Portal - Flutter client for Django REST API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  cloud_functions: ^5.2.4
  google_sign_in: ^6.2.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  intl: ^0.20.2
  fl_chart: ^0.69.2
  http: ^1.2.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  excel: ^4.0.6
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  package_info_plus: ^9.0.1
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#0B3B8C"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/icon/app_icon.png
    - assets/images/

  fonts:
    # Body / UI / tabular data - Inter (SIL OFL 1.1)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    # Display / headings - Plus Jakarta Sans (SIL OFL 1.1)
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
